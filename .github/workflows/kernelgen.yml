name: kernelgen

on:
  push:
  pull_request:

jobs:
  kernelgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e 'tools/kernelgen[test]'
      - run: pytest -q tools/kernelgen/tests
      # Generated kernels are committed; fail if they don't match the pinned modules.
      - run: aod-kernelgen --check
